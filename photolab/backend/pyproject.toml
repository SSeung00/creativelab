[project]
name = "photolab-backend"
version = "0.1.0"
description = "PhotoLab local API: RAW library, GPU develop engine, AI tools"
requires-python = ">=3.12"
dependencies = [
    "exifread>=3.5.1",
    "fastapi>=0.143.0",
    "imagecodecs>=2026.10.10",
    "mediapipe>=1.1.0",
    "numpy>=2.5.4",
    "onnxruntime-gpu>=1.31.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "rawpy>=0.27.1",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "spandrel>=0.4.2",
    "sqlmodel>=0.0.48",
    "tifffile>=2026.9.20",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
